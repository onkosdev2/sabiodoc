version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sabiodoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabiodoc
      POSTGRES_PASSWORD: sabiodoc_secret
      POSTGRES_DB: sabiodoc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabiodoc -d sabiodoc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sabiodoc-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sabiodoc.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
