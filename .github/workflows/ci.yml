name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sabiodoc
          POSTGRES_PASSWORD: sabiodoc_secret
          POSTGRES_DB: sabiodoc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sabiodoc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sabiodoc:sabiodoc_secret@localhost:5432/sabiodoc_db
      JWT_SECRET: ci-secret-with-at-least-32-characters-long
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Verificar drift de migraciones (modelos vs BD)
        run: alembic check

      - name: Tests
        run: pytest app/tests -q

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Typecheck (configs)
        run: npx tsc -p tsconfig.node.json --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
