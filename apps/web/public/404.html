<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Página no encontrada · SabioDoc</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 480px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        margin: 0 0 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      a {
        display: inline-block;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        text-decoration: none;
      }
      .primary {
        background: #0d9488;
        color: #fff;
      }
      .secondary {
        border: 1px solid #cbd5e1;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Página no encontrada</h1>
      <p>La página que buscas no existe o cambió de dirección.</p>
      <div class="actions">
        <a class="primary" href="/">Ir al inicio</a>
        <a class="secondary" href="/specialties">Ver especialidades</a>
      </div>
    </main>
    <script>
      // Las rutas públicas dinámicas viven como /<ruta>/index.html.
      // Si alguien llega sin barra final, se redirige a la forma canónica.
      // La respuesta inicial sigue siendo 404 para no crear soft 404.
      (function () {
        var path = window.location.pathname;
        if (path.charAt(path.length - 1) !== '/' && /^\/(specialties|doctors)\/[^/]+$/.test(path)) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </body>
</html>
